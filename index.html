<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для Николь 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Great+Vibes&family=Dancing+Script:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="particles" id="particles"></div>

    <div class="love-bg">
        <div class="heart heart-1">💕</div>
        <div class="heart heart-2">💗</div>
        <div class="heart heart-3">💜</div>
        <div class="heart heart-4">💖</div>
        <div class="heart heart-5">💘</div>
        <div class="heart heart-6">💝</div>
    </div>

    <button class="music-btn" id="musicBtn" aria-label="Музыка">
        <span id="musicIcon">♪</span>
    </button>

    <!-- ============ ЭТАП 1: ТАЙМЕР ============ -->
    <section class="stage active" id="stage-timer">
        <div class="timer-wrap">
            <div class="heart-divider top">
                <span class="line"></span>
                <span class="heart-icon">💗</span>
                <span class="line"></span>
            </div>
            <p class="subtitle">До особенного момента с тобой</p>
            <h1 class="title">Осталось совсем чуть-чуть<span class="dots">...</span></h1>
            <div class="timer" id="timer">
                <div class="timer-card">
                    <div class="timer-heart">💕</div>
                    <span class="num" id="days">00</span>
                    <span class="label">дней</span>
                </div>
                <div class="timer-card">
                    <div class="timer-heart">💕</div>
                    <span class="num" id="hours">00</span>
                    <span class="label">часов</span>
                </div>
                <div class="timer-card">
                    <div class="timer-heart">💕</div>
                    <span class="num" id="minutes">00</span>
                    <span class="label">минут</span>
                </div>
                <div class="timer-card">
                    <div class="timer-heart">💕</div>
                    <span class="num" id="seconds">00</span>
                    <span class="label">секунд</span>
                </div>
            </div>
            <div class="heart-divider bottom">
                <span class="line"></span>
                <span class="heart-icon">💜</span>
                <span class="line"></span>
            </div>
        </div>
    </section>

    <!-- ============ ЭТАП 2: БУКЕТ ============ -->
    <section class="stage" id="stage-bouquet">
        <div class="bouquet-wrapper">
            <p class="bouquet-caption">Это всё — для тебя 💐</p>
            <svg class="bouquet-svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid meet">

                <!-- Стебли -->
                <path class="stem" d="M200 500 Q195 400 200 320 Q205 250 200 200"
                      stroke="#6a8a4a" stroke-width="4" fill="none" stroke-linecap="round"/>
                <path class="stem" d="M200 380 Q160 340 130 320"
                      stroke="#6a8a4a" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path class="stem" d="M200 400 Q245 360 275 340"
                      stroke="#6a8a4a" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path class="stem" d="M200 320 Q165 280 145 240"
                      stroke="#6a8a4a" stroke-width="3" fill="none" stroke-linecap="round"/>
                <path class="stem" d="M200 340 Q240 300 260 260"
                      stroke="#6a8a4a" stroke-width="3" fill="none" stroke-linecap="round"/>

                <!-- Листья -->
                <ellipse class="leaf" cx="150" cy="360" rx="22" ry="10" fill="#8aa86a" transform="rotate(-40 150 360)"/>
                <ellipse class="leaf" cx="255" cy="380" rx="22" ry="10" fill="#8aa86a" transform="rotate(40 255 380)"/>

                <!-- Пионы -->
                <g class="peony-group" transform="translate(200,180)">
                    <g class="peony">
                        <circle class="petal p1" r="14" fill="#f8c8dc"/>
                        <circle class="petal p2" r="14" fill="#e8a8d0" transform="rotate(60) translate(0,-14)"/>
                        <circle class="petal p3" r="14" fill="#f8c8dc" transform="rotate(120) translate(0,-14)"/>
                        <circle class="petal p4" r="14" fill="#e8a8d0" transform="rotate(180) translate(0,-14)"/>
                        <circle class="petal p5" r="14" fill="#f8c8dc" transform="rotate(240) translate(0,-14)"/>
                        <circle class="petal p6" r="14" fill="#e8a8d0" transform="rotate(300) translate(0,-14)"/>
                        <circle r="10" fill="#fce8f4" class="core"/>
                        <circle r="5" fill="#d4568f" class="core"/>
                    </g>
                </g>

                <g class="peony-group" transform="translate(130,300) scale(0.9)">
                    <g class="peony">
                        <circle class="petal p1" r="14" fill="#f0d9f0"/>
                        <circle class="petal p2" r="14" fill="#e0b8e0" transform="rotate(60) translate(0,-14)"/>
                        <circle class="petal p3" r="14" fill="#f0d9f0" transform="rotate(120) translate(0,-14)"/>
                        <circle class="petal p4" r="14" fill="#e0b8e0" transform="rotate(180) translate(0,-14)"/>
                        <circle class="petal p5" r="14" fill="#f0d9f0" transform="rotate(240) translate(0,-14)"/>
                        <circle class="petal p6" r="14" fill="#e0b8e0" transform="rotate(300) translate(0,-14)"/>
                        <circle r="10" fill="#f8e8f8" class="core"/>
                        <circle r="5" fill="#8b5fbf" class="core"/>
                    </g>
                </g>

                <g class="peony-group" transform="translate(275,320) scale(0.9)">
                    <g class="peony">
                        <circle class="petal p1" r="14" fill="#e8b8d8"/>
                        <circle class="petal p2" r="14" fill="#d99cc4" transform="rotate(60) translate(0,-14)"/>
                        <circle class="petal p3" r="14" fill="#e8b8d8" transform="rotate(120) translate(0,-14)"/>
                        <circle class="petal p4" r="14" fill="#d99cc4" transform="rotate(180) translate(0,-14)"/>
                        <circle class="petal p5" r="14" fill="#e8b8d8" transform="rotate(240) translate(0,-14)"/>
                        <circle class="petal p6" r="14" fill="#d99cc4" transform="rotate(300) translate(0,-14)"/>
                        <circle r="10" fill="#fce8f4" class="core"/>
                        <circle r="5" fill="#a84a7a" class="core"/>
                    </g>
                </g>

                <g class="peony-group" transform="translate(145,220) scale(0.8)">
                    <g class="peony">
                        <circle class="petal p1" r="14" fill="#f5c9e0"/>
                        <circle class="petal p2" r="14" fill="#e8a8d0" transform="rotate(60) translate(0,-14)"/>
                        <circle class="petal p3" r="14" fill="#f5c9e0" transform="rotate(120) translate(0,-14)"/>
                        <circle class="petal p4" r="14" fill="#e8a8d0" transform="rotate(180) translate(0,-14)"/>
                        <circle class="petal p5" r="14" fill="#f5c9e0" transform="rotate(240) translate(0,-14)"/>
                        <circle class="petal p6" r="14" fill="#e8a8d0" transform="rotate(300) translate(0,-14)"/>
                        <circle r="10" fill="#fce8f4" class="core"/>
                        <circle r="5" fill="#a86ba8" class="core"/>
                    </g>
                </g>

                <g class="peony-group" transform="translate(260,240) scale(0.8)">
                    <g class="peony">
                        <circle class="petal p1" r="14" fill="#e0d0f8"/>
                        <circle class="petal p2" r="14" fill="#cbb8ee" transform="rotate(60) translate(0,-14)"/>
                        <circle class="petal p3" r="14" fill="#e0d0f8" transform="rotate(120) translate(0,-14)"/>
                        <circle class="petal p4" r="14" fill="#cbb8ee" transform="rotate(180) translate(0,-14)"/>
                        <circle class="petal p5" r="14" fill="#e0d0f8" transform="rotate(240) translate(0,-14)"/>
                        <circle class="petal p6" r="14" fill="#cbb8ee" transform="rotate(300) translate(0,-14)"/>
                        <circle r="10" fill="#f2eaff" class="core"/>
                        <circle r="5" fill="#8b5fbf" class="core"/>
                    </g>
                </g>

                <g class="peony-group" transform="translate(200,290) scale(0.95)">
                    <g class="peony">
                        <circle class="petal p1" r="14" fill="#f8c8dc"/>
                        <circle class="petal p2" r="14" fill="#e8a8d0" transform="rotate(60) translate(0,-14)"/>
                        <circle class="petal p3" r="14" fill="#f8c8dc" transform="rotate(120) translate(0,-14)"/>
                        <circle class="petal p4" r="14" fill="#e8a8d0" transform="rotate(180) translate(0,-14)"/>
                        <circle class="petal p5" r="14" fill="#f8c8dc" transform="rotate(240) translate(0,-14)"/>
                        <circle class="petal p6" r="14" fill="#e8a8d0" transform="rotate(300) translate(0,-14)"/>
                        <circle r="10" fill="#fce8f4" class="core"/>
                        <circle r="5" fill="#d4568f" class="core"/>
                    </g>
                </g>

                <!-- Парящие сердечки вокруг -->
                <text class="float-heart" x="90" y="180" font-size="22">💗</text>
                <text class="float-heart" x="310" y="200" font-size="18">💕</text>
                <text class="float-heart" x="80" y="260" font-size="16">💜</text>
                <text class="float-heart" x="320" y="280" font-size="20">💖</text>
            </svg>
        </div>
    </section>

    <!-- ============ ЭТАП 3: ОТПЕЧАТОК ============ -->
    <section class="stage" id="stage-fingerprint">
        <div class="fingerprint-wrap">
            <div class="hearts-above">
                <span>💗</span><span>💕</span><span>💗</span>
            </div>
            <h2 class="fingerprint-title">Только для тебя</h2>
            <div class="fingerprint-container" id="fingerprintContainer">
                <svg class="progress-ring" viewBox="0 0 220 220">
                    <circle class="ring-bg" cx="110" cy="110" r="100"/>
                    <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="100"/>
                </svg>
                <svg class="fingerprint" viewBox="0 0 100 130" id="fingerprintSvg">
                    <g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                        <path d="M50 10 C30 10 18 25 18 45 C18 60 22 70 22 85 C22 100 25 110 28 120"/>
                        <path d="M50 18 C35 18 26 30 26 45 C26 58 30 68 30 85 C30 98 32 108 35 118"/>
                        <path d="M50 26 C40 26 34 34 34 45 C34 55 37 65 37 82 C37 94 39 104 42 116"/>
                        <path d="M50 34 C44 34 42 40 42 48 C42 56 44 64 44 80 C44 92 46 102 48 114"/>
                        <path d="M50 42 C48 42 47 46 47 50 C47 56 48 62 48 78 C48 90 50 100 50 112"/>
                        <path d="M50 10 C70 10 82 25 82 45 C82 60 78 70 78 85 C78 100 75 110 72 120"/>
                        <path d="M50 18 C65 18 74 30 74 45 C74 58 70 68 70 85 C70 98 68 108 65 118"/>
                        <path d="M50 26 C60 26 66 34 66 45 C66 55 63 65 63 82 C63 94 61 104 58 116"/>
                        <path d="M50 34 C56 34 58 40 58 48 C58 56 56 64 56 80 C56 92 54 102 52 114"/>
                        <path d="M50 42 C52 42 53 46 53 50 C53 56 52 62 52 78 C52 90 50 100 50 112"/>
                    </g>
                </svg>
            </div>
            <p class="fingerprint-text">Приложи палец и удерживай, чтобы открыть 💜</p>
        </div>
    </section>

    <!-- ============ ЭТАП 4: КОНВЕРТ ============ -->
    <section class="stage" id="stage-envelope">
        <div class="envelope-wrap">
            <div class="envelope" id="envelope">
                <div class="envelope-back"></div>
                <div class="envelope-letter-preview"></div>
                <div class="envelope-front"></div>
                <div class="envelope-flap" id="envelopeFlap"></div>
                <div class="envelope-seal">💜</div>
                <div class="ribbon"></div>
            </div>
            <div class="envelope-text">
                <div class="hearts-row">💗 💕 💗</div>
                <p class="envelope-to" id="envelopeTo">Для Николь</p>
                <p class="envelope-from" id="envelopeFrom">От Ярика (Бублика) 💜</p>
            </div>
            <button class="btn-open" id="btnOpen">Открыть письмо 💌</button>
        </div>
    </section>

    <!-- ============ ЭТАП 5: ПИСЬМО ============ -->
    <section class="stage" id="stage-letter">
        <div class="letter-wrap">
            <div class="letter">
                <div class="letter-decoration decor-1">🌸</div>
                <div class="letter-decoration decor-2">🌿</div>
                <div class="letter-decoration decor-3">🪶</div>
                <div class="letter-decoration decor-4">💗</div>
                <div class="letter-content">
                    <div class="letter-text" id="letterText"></div>
                    <div class="letter-signature" id="letterSignature">
                        <svg viewBox="0 0 200 60" class="signature-svg">
                            <path id="signaturePath"
                                  d="M10,40 Q30,10 50,35 T90,30 Q110,5 130,35 T170,25 Q185,20 190,35"
                                  fill="none" stroke="#a84a7a" stroke-width="2"
                                  stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
                <div class="wax-seal">💜</div>
            </div>
            <button class="btn-restart" id="btnRestart">Посмотреть ещё раз 💕</button>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
